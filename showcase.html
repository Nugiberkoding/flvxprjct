<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio</title>
  <link rel="icon" type="image/png" href="logo putih.png" />

  <style>
    /* Load your font */
    @font-face {
      font-family: 'RageItalic';
      src: url('Rage Italic Regular.ttf') format('truetype');
      font-style: normal;
    }

    :root {
      --bg: #ffffff;
      --text: #000000;
    }

    body.dark {
      --bg: #000000;
      --text: #ffffff;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: 'RageItalic', cursive !important;
      font-weight: normal !important;  /* not bold */
      transition: background 0.4s ease, color 0.4s ease;
      user-select: none;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 900px;
      margin: auto;
    }

    /* Button underline only */
    .toggle-btn {
      background: none;
      border: none;
      border-bottom: 1px solid var(--text);
      padding: 6px 4px;
      cursor: pointer;
      color: var(--text);
      transition: 0.3s ease, transform 0.2s ease;
      font-family: 'RageItalic';
      font-weight: normal !important;  /* not bold */
    }

    h1, h2 {
      font-family: 'RageItalic';
      text-align: center;
      font-weight: normal !important;  /* not bold */
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 900px;
      margin: 30px auto;
    }

    /* Prevent image interaction */
    .item {
      position: relative;
    }

    .item img {
      width: 100%;
      height: auto;
      pointer-events: none;
      user-drag: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      transition: filter 0.4s ease;
    }

    .item::after {
      content: "";
      position: absolute;
      inset: 0;
      background: transparent;
      pointer-events: all;
    }

    body.dark .item img {
      filter: invert(1);
    }

    /* FLASH animation */
    .mode-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--text);
      opacity: 0;
      pointer-events: none;
      animation: flashAnim 0.4s ease forwards;
      z-index: 9999;
    }

    @keyframes flashAnim {
      0% { opacity: 0; }
      20% { opacity: 0.4; }
      100% { opacity: 0; }
    }
  </style>
</head>

<body class="dark" oncontextmenu="return false">
  <header>
    <h2>flvxprjct</h2>
    <button class="toggle-btn" id="modeToggle">Light Mode</button>
  </header>

  <h1>Artwork Showcase</h1>

  <div class="gallery">
    <div class="item">
      <img src="cybersigilism 4.png" alt="Artwork">
      <img src="Untitled_Artwork (41).png" alt="Artwork">
    </div>
  </div>

  <script>
    const toggle = document.getElementById("modeToggle");

    toggle.addEventListener("click", () => {
      const flash = document.createElement("div");
      flash.classList.add("mode-flash");
      document.body.appendChild(flash);
      setTimeout(() => flash.remove(), 400);

      document.body.classList.toggle("dark");

      toggle.textContent = document.body.classList.contains("dark")
        ? "Light Mode"
        : "Dark Mode";
    });
  </script>

</body>
</html>
